<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로세스 인포그래픽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        /* 화살표 스타일 */
        .arrow-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .arrow {
            width: 100%;
            height: 2px;
            background-color: #9ca3af; /* gray-400 */
            position: relative;
        }
        .arrow::after {
            content: '';
            position: absolute;
            right: -1px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 8px solid #9ca3af; /* gray-400 */
        }
        /* 세로 모드 화살표 */
        .vertical-arrow-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vertical-arrow {
            width: 2px;
            height: 40px;
            background-color: #9ca3af; /* gray-400 */
            position: relative;
        }
        .vertical-arrow::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid #9ca3af; /* gray-400 */
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-2xl shadow-xl p-8 md:p-12 w-full max-w-7xl">
        <!-- 제목 -->
        <h1 class="text-3xl md:text-4xl font-bold text-center text-gray-800 mb-4">콘텐츠 개발 프로세스</h1>
        <p class="text-center text-gray-500 mb-12 md:mb-20">체계적인 5단계 프로세스를 통해 최고의 결과물을 만들어냅니다.</p>

        <!-- 인포그래픽 컨테이너 -->
        <div class="w-full">
            <!-- 데스크탑 뷰 (가로) -->
            <div class="hidden lg:flex items-start justify-between space-x-4">
                <!-- 1단계 -->
                <div class="flex flex-col items-center text-center w-1/5">
                    <div class="bg-blue-500 rounded-full w-20 h-20 flex items-center justify-center mb-4 shadow-md">

                    </div>
                    <div class="bg-blue-100 text-blue-800 text-sm font-semibold px-3 py-1 rounded-full mb-2">STEP 1</div>
                    <h3 class="font-bold text-lg text-gray-700">기초조사 및<br>수요 분석</h3>
                </div>

                <div class="arrow-container mt-10">
                    <div class="arrow"></div>
                </div>

                    </div>
                    <div class="bg-teal-100 text-teal-800 text-sm font-semibold px-3 py-1 rounded-full mb-2">STEP 2</div>

                </div>

                    <div class="arrow"></div>
                </div>

                    </div>
                    <div class="bg-purple-100 text-purple-800 text-sm font-semibold px-3 py-1 rounded-full mb-2">STEP 3</div>
                    <h3 class="font-bold text-lg text-gray-700">전문가 협의 및<br>검증</h3>
                </div>

                    <div class="arrow"></div>
                </div>

                    </div>
                    <div class="bg-orange-100 text-orange-800 text-sm font-semibold px-3 py-1 rounded-full mb-2">STEP 4</div>
                    <h3 class="font-bold text-lg text-gray-700">시범운용 및 피드백<br>개선·보완</h3>
                </div>

                <div class="arrow-container mt-10">
                    <div class="arrow"></div>
                </div>

                <!-- 5단계 -->
                <div class="flex flex-col items-center text-center w-1/5">
                    <div class="bg-green-500 rounded-full w-20 h-20 flex items-center justify-center mb-4 shadow-md">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>

                    <h3 class="font-bold text-lg text-gray-700">최종 자료 제작<br>및 배포</h3>
                </div>
            </div>

            <div class="lg:hidden flex flex-col items-center space-y-4">
                 <!-- 1단계 -->

                    <h3 class="font-bold text-xl text-gray-700">기초조사 및 수요 분석</h3>
                </div>

                <div class="vertical-arrow-container">
                    <div class="vertical-arrow"></div>
                </div>

                <!-- 2단계 -->
                <div class="flex flex-col items-center text-center w-full max-w-sm">
                    <div class="bg-teal-500 rounded-full w-20 h-20 flex items-center justify-center mb-4 shadow-md">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                    </div>
                    <div class="bg-teal-100 text-teal-800 text-sm font-semibold px-3 py-1 rounded-full mb-2">STEP 2</div>
                    <h3 class="font-bold text-xl text-gray-700">콘텐츠 기획 및 시안 개발</h3>
                </div>

                <div class="vertical-arrow-container">
                    <div class="vertical-arrow"></div>
                </div>

                <!-- 3단계 -->
                <div class="flex flex-col items-center text-center w-full max-w-sm">
                    <div class="bg-purple-500 rounded-full w-20 h-20 flex items-center justify-center mb-4 shadow-md">
                       <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    </div>
                    <div class="bg-purple-100 text-purple-800 text-sm font-semibold px-3 py-1 rounded-full mb-2">STEP 3</div>
                    <h3 class="font-bold text-xl text-gray-700">전문가 협의 및 검증</h3>
                </div>

                <div class="vertical-arrow-container">
                    <div class="vertical-arrow"></div>
                </div>

                <!-- 4단계 -->
                <div class="flex flex-col items-center text-center w-full max-w-sm">
                    <div class="bg-orange-500 rounded-full w-20 h-20 flex items-center justify-center mb-4 shadow-md">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    </div>
                    <div class="bg-orange-100 text-orange-800 text-sm font-semibold px-3 py-1 rounded-full mb-2">STEP 4</div>
                    <h3 class="font-bold text-xl text-gray-700">시범운용 및 피드백 개선·보완</h3>
                </div>

                <div class="vertical-arrow-container">
                    <div class="vertical-arrow"></div>
                </div>

                <!-- 5단계 -->
                <div class="flex flex-col items-center text-center w-full max-w-sm">
                    <div class="bg-green-500 rounded-full w-20 h-20 flex items-center justify-center mb-4 shadow-md">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </div>
                    <div class="bg-green-100 text-green-800 text-sm font-semibold px-3 py-1 rounded-full mb-2">STEP 5</div>
                    <h3 class="font-bold text-xl text-gray-700">최종 자료 제작 및 배포</h3>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
